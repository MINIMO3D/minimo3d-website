services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_DB: payload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payload']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://payload:${POSTGRES_PASSWORD}@db:5432/payload
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      # Stripe: leer = Bestellen im Preisrechner ist abgeschaltet (siehe scripts/set-stripe-key.sh)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SITE_URL: ${SITE_URL:-}
    volumes:
      - media:/app/media
      - inquiry_files:/app/inquiry-files
      - quote_files:/app/quote-files

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  inquiry_files:
  quote_files:
  caddy_data:
  caddy_config:
